<svg width="700" height="500" viewBox="0 0 700 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="500" fill="#0D0D0D"/>
  <rect x="0" y="0" width="700" height="500" fill="url(#grid)" opacity="0.15"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="700" height="500" fill="url(#glow1)"/>
  <rect width="700" height="500" fill="url(#glow2)"/>

  <!-- Browser mockup -->
  <rect x="80" y="80" width="540" height="320" rx="12" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
  <rect x="80" y="80" width="540" height="36" rx="12" fill="#222"/>
  <rect x="80" y="104" width="540" height="12" fill="#222"/>
  <circle cx="104" cy="98" r="5" fill="#FF5F57"/>
  <circle cx="120" cy="98" r="5" fill="#FFBD2E"/>
  <circle cx="136" cy="98" r="5" fill="#28CA41"/>
  <rect x="168" y="90" width="240" height="16" rx="8" fill="#111"/>

  <!-- Nav bar -->
  <rect x="80" y="116" width="540" height="44" fill="#111"/>
  <rect x="100" y="128" width="60" height="20" rx="4" fill="#FF6B35"/>
  <rect x="340" y="130" width="40" height="16" rx="3" fill="#333"/>
  <rect x="390" y="130" width="40" height="16" rx="3" fill="#333"/>
  <rect x="440" y="130" width="40" height="16" rx="3" fill="#333"/>
  <rect x="560" y="127" width="44" height="22" rx="11" fill="#FF6B35"/>

  <!-- Hero section -->
  <rect x="80" y="160" width="540" height="240" fill="#0D0D0D"/>
  <rect x="100" y="185" width="180" height="24" rx="4" fill="#FF6B35" opacity="0.8"/>
  <rect x="100" y="217" width="260" height="14" rx="3" fill="#444"/>
  <rect x="100" y="237" width="220" height="14" rx="3" fill="#444"/>
  <rect x="100" y="257" width="190" height="14" rx="3" fill="#444"/>
  <rect x="100" y="283" width="80" height="26" rx="13" fill="#FF6B35"/>
  <rect x="190" y="283" width="80" height="26" rx="13" fill="#222" stroke="#444" stroke-width="1"/>

  <!-- Image placeholder -->
  <rect x="390" y="175" width="210" height="200" rx="10" fill="#1A1A1A" stroke="#333" stroke-width="1"/>
  <rect x="406" y="191" width="178" height="120" rx="6" fill="#111"/>
  <rect x="406" y="319" width="60" height="10" rx="3" fill="#333"/>
  <rect x="476" y="319" width="80" height="10" rx="3" fill="#FF6B35" opacity="0.4"/>

  <!-- Bottom label -->
  <rect x="80" y="415" width="540" height="58" rx="10" fill="#111" stroke="#222" stroke-width="1"/>
  <text x="104" y="440" font-family="sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Korlod Works</text>
  <text x="104" y="458" font-family="sans-serif" font-size="10" fill="#666">Web Design  ·  Brand Identity  ·  Agency Website</text>
  <rect x="510" y="425" width="90" height="28" rx="14" fill="#FF6B35" fill-opacity="0.15" stroke="#FF6B35" stroke-width="1"/>
  <text x="555" y="443" font-family="sans-serif" font-size="9" fill="#FF6B35" text-anchor="middle" font-weight="600">Case Study</text>
</svg>
